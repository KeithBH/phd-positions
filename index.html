": "待确认", "职位标题": "PhD – AI for Predictive Maintenance", "研究方向": "基于ML的CNC设备预测性维护", "截止日期": "2026-07-15", "链接": "https://www.academics.de/jobs/phd-position-ai-predictive-maintenance-tum-2026", "适配性": "3", "状态": "已过期", "备注": "ARMAS项目直接相关：AI驱动的设备监测+异常检测", "类型": "岗位制"}];
let currentSort = {col: 0, asc: false};
let showExpired = false;

function toggleExpired() {
  showExpired = !showExpired;
  const btn = document.getElementById('toggle-expired');
  btn.textContent = showExpired ? '隐藏过期' : '显示过期';
  btn.classList.toggle('on', showExpired);
  applyFilters();
}

function quickFilter(preset) {
  resetFilters(true);
  if (preset === 'active') {
    showExpired = false;
    document.getElementById('toggle-expired').textContent = '显示过期';
    document.getElementById('toggle-expired').classList.remove('on');
  } else if (preset === 'expired') {
    showExpired = true;
    document.getElementById('filter-status').value = '已过期';
    document.getElementById('toggle-expired').textContent = '隐藏过期';
    document.getElementById('toggle-expired').classList.add('on');
  } else if (preset === 'high') {
    document.getElementById('filter-relevance').value = '3';
    showExpired = false;
    document.getElementById('toggle-expired').textContent = '显示过期';
    document.getElementById('toggle-expired').classList.remove('on');
  }
  updateStatHighlight(preset);
  applyFilters();
}

function updateStatHighlight(preset) {
  document.querySelectorAll('.stat').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('stat-' + preset);
  if (el) el.classList.add('active');
}

function resetFilters(silent) {
  document.getElementById('filter-country').value = '';
  document.getElementById('filter-university').value = '';
  document.getElementById('filter-type').value = '';
  document.getElementById('filter-relevance').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-search').value = '';
  showExpired = false;
  document.getElementById('toggle-expired').textContent = '显示过期';
  document.getElementById('toggle-expired').classList.remove('on');
  document.querySelectorAll('.stat').forEach(s => s.classList.remove('active'));
  if (!silent) applyFilters();
}

function renderChips() {
  const chips = [];
  const c = document.getElementById('filter-country').value;
  const u = document.getElementById('filter-university').value;
  const t = document.getElementById('filter-type').value;
  const r = document.getElementById('filter-relevance').value;
  const s = document.getElementById('filter-status').value;
  const q = document.getElementById('filter-search').value;
  if (c) chips.push({k:'country',v:c,label:'国家: '+c});
  if (u) chips.push({k:'university',v:u,label:'大学: '+u});
  if (t) chips.push({k:'type',v:t,label:t});
  if (r) chips.push({k:'relevance',v:r,label:'⭐'.repeat(parseInt(r))});
  if (s) chips.push({k:'status',v:s,label:s});
  if (q) chips.push({k:'search',v:q,label:'🔍 '+q});
  if (showExpired) chips.push({k:'expired',v:'1',label:'含过期'});

  const container = document.getElementById('active-chips');
  container.innerHTML = chips.map(ch =>
    `<span class="chip">${ch.label}<span class="chip-close" onclick="removeChip('${ch.k}')">&times;</span></span>`
  ).join('');
}

function removeChip(key) {
  const map = {
    country: 'filter-country', university: 'filter-university',
    type: 'filter-type', relevance: 'filter-relevance',
    status: 'filter-status', search: 'filter-search'
  };
  if (key === 'expired') {
    showExpired = false;
    document.getElementById('toggle-expired').textContent = '显示过期';
    document.getElementById('toggle-expired').classList.remove('on');
  } else if (map[key]) {
    document.getElementById(map[key]).value = '';
  }
  applyFilters();
}

function renderTable(data) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = data.map(r => {
    const rel = parseInt(r['适配性']) || 0;
    const stars = rel === 3 ? '⭐⭐⭐' : rel === 2 ? '⭐⭐' : '⭐';
    const isExpired = r['状态'] && (r['状态'].includes('已过期') || r['状态'].includes('过期'));
    const rowClass = isExpired ? ' class="expired"' : '';
    return `<tr${rowClass}>
<td>${r['ID']}</td>
<td>${r['国家']}</td>
<td>${r['大学']}</td>
<td class="title-col"><strong>${r['职位标题']}</strong>${r['研究方向'] ? '<br><small style="color:#888">'+r['研究方向']+'</small>' : ''}</td>
<td><span class="relevance r${rel}">${stars}</span></td>
<td><span class="status-badge s-${r['状态']}">${r['状态']}</span></td>
<td style="white-space:nowrap">${r['截止日期']}</td>
<td><a class="link-btn" href="${r['链接']}" target="_blank" rel="noopener" title="${r['链接']}">🔗</a></td>
</tr>`;
  }).join('');
  document.getElementById('result-count').textContent = `${data.length} 条`;
}

function applyFilters() {
  const country = document.getElementById('filter-country').value;
  const university = document.getElementById('filter-university').value;
  const type = document.getElementById('filter-type').value;
  const relevance = document.getElementById('filter-relevance').value;
  const status = document.getElementById('filter-status').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  let filtered = DATA;

  // Always filter expired unless toggled
  if (!showExpired && !status) {
    filtered = filtered.filter(r => !((r['状态']||'').includes('已过期') || (r['状态']||'').includes('过期')));
  }

  if (country) filtered = filtered.filter(r => r['国家'] === country);
  if (university) filtered = filtered.filter(r => r['大学'] === university);
  if (type) filtered = filtered.filter(r => r['类型'] === type);
  if (relevance) filtered = filtered.filter(r => r['适配性'] === relevance);
  if (status) filtered = filtered.filter(r => r['状态'] === status);
  if (search) {
    filtered = filtered.filter(r =>
      (r['职位标题']||'').toLowerCase().includes(search) ||
      (r['大学']||'').toLowerCase().includes(search) ||
      (r['研究方向']||'').toLowerCase().includes(search) ||
      (r['导师']||'').toLowerCase().includes(search) ||
      (r['备注']||'').toLowerCase().includes(search)
    );
  }

  // Sort
  const cols = ['ID', '国家', '大学', '职位标题', '适配性', '状态', '截止日期'];
  const col = cols[currentSort.col];
  filtered.sort((a, b) => {
    let va = a[col] || '', vb = b[col] || '';
    if (col === 'ID' || col === '适配性') { va = parseInt(va)||0; vb = parseInt(vb)||0; }
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return currentSort.asc ? cmp : -cmp;
  });

  renderTable(filtered);
  renderChips();
}

function sortTable(colIdx) {
  if (currentSort.col === colIdx) currentSort.asc = !currentSort.asc;
  else { currentSort.col = colIdx; currentSort.asc = true; }
  document.querySelectorAll('th .sort-arrow').forEach((el, i) => {
    el.textContent = i === colIdx ? (currentSort.asc ? '▲' : '▼') : '';
  });
  applyFilters();
}

// Init: show active only, newest first
applyFilters();
</script>
